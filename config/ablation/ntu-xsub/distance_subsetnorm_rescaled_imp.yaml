work_dir: ./work_dir/ablation/ntu-xsub/distance_subsetnorm_rescaled_imp

# feeder
feeder: feeder.feeder.Feeder
train_feeder_args:
  data_path: ./data/NTU-RGB-D/xsub/train_data.npy
  label_path: ./data/NTU-RGB-D/xsub/train_label.pkl
test_feeder_args:
  data_path: ./data/NTU-RGB-D/xsub/val_data.npy
  label_path: ./data/NTU-RGB-D/xsub/val_label.pkl

# model
model: net.st_gcn.Model
model_args:
  in_channels: 3
  num_class: 60
  dropout: 0.5
  edge_importance_weighting: True
  graph_args:
    layout: 'ntu-rgb+d'
    strategy: 'distance_subsetnorm_rescaled'

# optim
weight_decay: 0.0001
base_lr: 0.025
step: [10]
optimizer: SGD
nesterov: True

# training
device: [0]
seed: 49
batch_size: 16
test_batch_size: 16
num_worker: 4
num_epoch: 20
save_interval: 20
eval_interval: 5
log_interval: 20
amp: True
